plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'java-library'
}

repositories {
    google()
    mavenCentral()
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
