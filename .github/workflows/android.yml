name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dsh-mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 项目用了 New Architecture + 若干原生模块，必须装 NDK 才能编译
      - name: Install NDK and platform
        run: |
          sdkmanager --install "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('dsh-mobile/android/**/*.gradle*', 'dsh-mobile/android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: dsh-mobile
        run: npm ci

      - name: Unit tests
        working-directory: dsh-mobile
        run: npm test

      - name: Build release APK
        working-directory: dsh-mobile/android
        env:
          # 未配置签名密钥时回退到 debug 签名（能装、不能上架）
          DSH_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DSH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DSH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DSH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$DSH_KEYSTORE_BASE64" ]; then
            echo "使用仓库配置的签名密钥"
            echo "$DSH_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            ./gradlew assembleRelease --no-daemon \
              -PDSH_STORE_FILE=app/release.keystore \
              -PDSH_STORE_PASSWORD="$DSH_KEYSTORE_PASSWORD" \
              -PDSH_KEY_ALIAS="$DSH_KEY_ALIAS" \
              -PDSH_KEY_PASSWORD="$DSH_KEY_PASSWORD"
          else
            echo "未配置签名密钥，使用 debug 签名构建（可侧载，不可上架）"
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Prepare artifact
        id: artifact
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="build-${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p out
          cp dsh-mobile/android/app/build/outputs/apk/release/app-release.apk "out/dsh-pocket-${VERSION}.apk"
          echo "name=dsh-pocket-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pocket-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            ## 安装

            1. 下载下面的 `dsh-pocket-*.apk`
            2. 手机上允许「安装未知来源应用」后安装
            3. 电脑上运行 `start-dsh-web.ps1` 启动 DSH 服务
            4. 打开 App 扫码配对

            详细步骤见 [README](https://github.com/xisnn/dsh-pocket#5-分钟上手)。

            > 本 APK 由 GitHub Actions 自动构建。若未配置签名密钥，使用 debug 签名，仅适合个人侧载使用。
