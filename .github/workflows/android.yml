name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 测试通过 tsx 运行（esbuild 做类型剥离），不依赖 Node 原生 TS 支持，
          # 所以 Node 20 就能跑。用 LTS 更稳。
          node-version: 20
          cache: npm
          cache-dependency-path: dsh-mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 不用 android-actions/setup-android：它会执行 `sdkmanager tools`，
      # 而 runner 预装的 cmdline-tools 16.0 已经移除了这个包，直接报错退出。
      # GitHub 的 ubuntu-latest 本来就带好了 SDK / build-tools，直接用即可。
      - name: Inspect Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ls "$ANDROID_SDK_ROOT/platforms" || true
          ls "$ANDROID_SDK_ROOT/ndk" || true
          ls "$ANDROID_SDK_ROOT/build-tools" || true

      # 项目需要 NDK 27.1.12297006（New Architecture 编译必需）、
      # platform 36、build-tools 36.0.0；缺哪个补哪个（已存在则秒过）。
      - name: Ensure NDK and SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager: $SDKMANAGER"

          need=""
          [ -d "$SDK/ndk/27.1.12297006" ] || need="$need ndk;27.1.12297006"
          [ -d "$SDK/platforms/android-36" ] || need="$need platforms;android-36"
          [ -d "$SDK/build-tools/36.0.0" ] || need="$need build-tools;36.0.0"

          if [ -n "$need" ]; then
            echo "安装缺少的包:$need"
            yes | "$SDKMANAGER" --install $need
          else
            echo "NDK / platform / build-tools 都已存在，跳过下载"
          fi

          echo "ANDROID_NDK_HOME=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('dsh-mobile/android/**/*.gradle*', 'dsh-mobile/android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: dsh-mobile
        run: npm ci

      - name: Unit tests
        working-directory: dsh-mobile
        run: npm test

      # 用 tag 推导版本号，写进 package.json 和 Gradle，
      # 保证「安装包里的版本」和「应用内更新检查的基准」是同一个值。
      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="v0.0.${GITHUB_RUN_NUMBER}"
            echo "非 tag 触发，使用合成版本 $TAG"
          fi
          VER="${TAG#v}"
          # 位加权：major*1000000 + minor*1000 + patch，避免 minor 跨十位时和 major 冲突
          # v0.2.0 -> 2000，v0.10.2 -> 10002，v1.0.0 -> 1000000
          IFS='.' read -r MAJ MIN PAT <<< "$VER"
          CODE=$(( MAJ * 1000000 + MIN * 1000 + ${PAT:-0} ))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "版本: $TAG (versionCode=$CODE)"

          # package.json 是 JS 侧读取版本号的唯一来源
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('dsh-mobile/package.json','utf8'));
            p.version='$VER';
            fs.writeFileSync('dsh-mobile/package.json', JSON.stringify(p,null,2)+'\n');
          "
          node -e "console.log('package.json version =', require('./dsh-mobile/package.json').version)"

      - name: Build release APK
        working-directory: dsh-mobile/android
        env:
          # 未配置签名密钥时回退到 debug 签名（能装、不能上架）
          DSH_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DSH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DSH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DSH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION_ARGS="-PDSH_VERSION_NAME=${{ steps.ver.outputs.version }} -PDSH_VERSION_CODE=${{ steps.ver.outputs.code }}"
          echo "Gradle 版本参数: $VERSION_ARGS"

          if [ -n "$DSH_KEYSTORE_BASE64" ]; then
            echo "使用仓库配置的签名密钥"
            echo "$DSH_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            ./gradlew assembleRelease --no-daemon $VERSION_ARGS \
              -PDSH_STORE_FILE=app/release.keystore \
              -PDSH_STORE_PASSWORD="$DSH_KEYSTORE_PASSWORD" \
              -PDSH_KEY_ALIAS="$DSH_KEY_ALIAS" \
              -PDSH_KEY_PASSWORD="$DSH_KEY_PASSWORD"
          else
            echo "未配置签名密钥，使用 debug 签名构建（可侧载，不可上架）"
            ./gradlew assembleRelease --no-daemon $VERSION_ARGS
          fi

      - name: Prepare artifact
        id: artifact
        run: |
          VERSION="${{ steps.ver.outputs.tag }}"
          mkdir -p out
          cp dsh-mobile/android/app/build/outputs/apk/release/app-release.apk "out/dsh-pocket-${VERSION}.apk"
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pocket-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            ## 安装

            1. 下载下面的 `dsh-pocket-*.apk`
            2. 手机上允许「安装未知来源应用」后安装
            3. 电脑上运行 `start-dsh-web.ps1` 启动 DSH 服务
            4. 打开 App 扫码配对

            详细步骤见 [README](https://github.com/xisnn/dsh-pocket#5-分钟上手)。

            > 本 APK 由 GitHub Actions 自动构建。若未配置签名密钥，使用 debug 签名，仅适合个人侧载使用。
