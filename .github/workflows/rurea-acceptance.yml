name: Rurea Emulator Acceptance (B4)

# B4 隔离正常进程回归工作流：
# - 仅运行隔离测试包（com.dshoutpost.p1.p6next），绝不触碰正式应用包与签名 Secrets。
# - 使用 reactivecircus/android-emulator-runner 启动正常 Android 模拟器（无障碍可真实绑定）
#   覆盖 C3（跨 4 次冷重启 + v1->v2 迁移 + 降级阻断）与 C1+C2+C4（流式/安全门/错误恢复）。
# - B2 后台副屏手势套件因依赖 Shizuku 守护进程，由真机规程（docs/rurea-acceptance-runbook.md）覆盖。

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Acceptance suite (c3, c1c2c4, or all)'
        type: choice
        options:
          - c3
          - c1c2c4
          - all
        default: c3

permissions:
  contents: read

concurrency:
  group: rurea-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dsh-mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Ensure NDK and SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          need=""
          [ -d "$SDK/ndk/27.1.12297006" ] || need="$need ndk;27.1.12297006"
          [ -d "$SDK/platforms/android-36" ] || need="$need platforms;android-36"
          [ -d "$SDK/build-tools/36.0.0" ] || need="$need build-tools;36.0.0"
          if [ -n "$need" ]; then yes | "$SDKMANAGER" --install $need; fi
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('dsh-mobile/android/**/*.gradle*', 'dsh-mobile/android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: dsh-mobile
        run: npm ci

      - name: Run C3 isolated acceptance on emulator
        if: inputs.suite == 'c3' || inputs.suite == 'all'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: dsh-mobile
          script: node scripts/run-rurea-acceptance.mjs --suite c3 --abi x86_64 --report-out acceptance-c3-report.json

      - name: Run C1+C2+C4 isolated acceptance on emulator
        if: inputs.suite == 'c1c2c4' || inputs.suite == 'all'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: dsh-mobile
          script: node scripts/run-rurea-acceptance.mjs --suite c1c2c4 --abi x86_64 --report-out acceptance-c1c2c4-report.json

      - name: Upload acceptance reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rurea-acceptance-reports
          path: dsh-mobile/acceptance-*-report.json
          if-no-files-found: ignore
          retention-days: 14
