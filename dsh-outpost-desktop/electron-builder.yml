{
  "$schema": "https://raw.githubusercontent.com/electron-userland/electron-builder/master/packages/app-builder-lib/scheme.json",
  "appId": "com.dshpocket.desktop",
  "productName": "DSH Outpost",
  "directories": {
    "output": "release",
    "buildResources": "assets"
  },
  "electronDist": "node_modules/electron/dist",
  "compression": "normal",
  "files": [
    "src/**/*",
    "assets/tray.png",
    "package.json"
  ],
  "extraFiles": [
    {
      "from": "启动 DSH Outpost.bat",
      "to": "启动 DSH Outpost.bat"
    },
    {
      "from": "diagnose.bat",
      "to": "diagnose.bat"
    }
  ],
  "extraResources": [
    {
      "from": "../dsh-plugin-connect/tunnel-service.mjs",
      "to": "tunnel-service.mjs"
    }
  ],
  "win": {
    "target": [
      {
        "target": "portable",
        "arch": ["x64"]
      }
    ],
    "icon": "assets/icon.png",
    "signAndEditExecutable": false,
    "artifactName": "DSH-Outpost-Desktop-${version}-win-x64.${ext}"
  },
  "portable": {
    "artifactName": "DSH-Outpost-Desktop-${version}-portable.${ext}"
  }
}
