{
  "$schema": "https://raw.githubusercontent.com/electron-userland/electron-builder/master/packages/app-builder-lib/scheme.json",
  "appId": "com.dshpocket.desktop",
  "productName": "DSH Outpost",
  "directories": {
    "output": "release",
    "buildResources": "assets"
  },
  "electronDist": "node_modules/electron/dist",
  "compression": "normal",
  "files": [
    "src/**/*",
    "assets/tray.png",
    "package.json"
  ],
  "extraFiles": [
    {
      "from": "START.bat",
      "to": "START.bat"
    },
    {
      "from": "diagnose.bat",
      "to": "DIAGNOSE.bat"
    },
    {
      "from": "repair-startup.ps1",
      "to": "REPAIR-STARTUP.ps1"
    }
  ],
  "extraResources": [
    {
      "from": "../dsh-plugin-connect/tunnel-service.mjs",
      "to": "tunnel-service.mjs"
    },
    {
      "from": "../start-dsh-web.ps1",
      "to": "start-dsh-web.ps1"
    },
    {
      "from": "../start-tunnel.ps1",
      "to": "start-tunnel.ps1"
    },
    {
      "from": "../scripts",
      "to": "scripts"
    },
    {
      "from": "../patches",
      "to": "patches"
    }
  ],
  "win": {
    "target": [
      {
        "target": "portable",
        "arch": [
          "x64"
        ]
      }
    ],
    "icon": "assets/icon.png",
    "signAndEditExecutable": false,
    "artifactName": "DSH-Outpost-Desktop-${version}-win-x64.${ext}"
  },
  "portable": {
    "artifactName": "DSH-Outpost-Desktop-${version}-portable.${ext}"
  }
}
